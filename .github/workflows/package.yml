name: Package
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDreamer-${{ runner.os }}
          path: release/
